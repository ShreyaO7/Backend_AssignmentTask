$kind: http-request
id: 49675473-7a36111e-79d1-42f3-ac26-a8e9c922c0e7
name: Create Teacher
method: POST
url: '{{baseUrl}}/teachers'
body:
  type: json
  content: '{"fullName":"Amit Sharma","email":"amit+{{$timestamp}}@example.com","specialization":"Mathematics","experience":5}'
headers:
  - key: Content-Type
    value: application/json
scripts:
  - type: afterResponse
    code: |
      pm.test("Status code is 201", function () {
        pm.response.to.have.status(201);
      });

      if (pm.response.code === 201) {
        pm.collectionVariables.set("teacherId", pm.response.json().data._id);
      }
    language: text/javascript
