$kind: http-request
id: 49675473-249b3a4a-d08c-4a7c-aa9c-80ebfca98ed7
name: Create User
method: POST
url: '{{baseUrl}}/users'
body:
  type: json
  content: '{"fullName":"Shreya Ojha","email":"shreya+{{$timestamp}}@example.com","phone":"9876543210"}'
headers:
  - key: Content-Type
    value: application/json
scripts:
  - type: afterResponse
    code: |
      pm.test("Status code is 201", function () {
        pm.response.to.have.status(201);
      });

      if (pm.response.code === 201) {
        pm.collectionVariables.set("userId", pm.response.json().data._id);
      }
    language: text/javascript
